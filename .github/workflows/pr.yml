name: pr

# Isolated contribution check: untrusted fork code builds and lints here with
# no organization secrets and no self-hosted runner. Runs only on
# pull_request (never pull_request_target), on GitHub-hosted runners, with a
# read-only token. Release stays on release.yml (tags + manual dispatch).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
